services:
  database:
    image: postgres:17.5-bookworm
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - api_gateway_db_volume:/var/lib/postgresql/data
      # Mount initialization script to create API database or other needed DBs
      # Please ensure the script has proper permissions (e.g., chmod +x)
      # Run for the 1st time ONLY: chmod +x docker/init_databases.sh
      # - type: bind
      #   source: ./docker/init_databases.sh
      #   target: /docker-entrypoint-initdb.d/init_databases.sh
      #   read_only: true
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-apigateway} -d ${POSTGRES_DB:-apigateway_db}
      interval: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:8.2.3-bookworm
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - type: bind
        source: ./docker/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
    # Start Redis server with custom config and maxclients setting
    command: redis-server /usr/local/etc/redis/redis.conf --maxclients 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # For Redis GUI management
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis
    # Connection URL:
    # redis://:<password>@<host>:<port>/<db_number>
    # e.g. redis://:redis@redis:6379/0
    # Note: Use `redis` instead of `localhost` when connecting from within another container

  jaeger:
    # For distributed tracing collection and visualization
    image: jaegertracing/jaeger:2.14.1
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true # enable OTLP receiver so Jaeger accepts OpenTelemetry traces
      - SPAN_STORAGE_TYPE=badger # use BadgerDB as the span storage backend (embedded KV store)
      - BADGER_EPHEMERAL=false # false = persist Badger data on disk; true = in-memory/ephemeral
      - BADGER_DIRECTORY_VALUE=/badger/data # path inside container for Badger value log
      - BADGER_DIRECTORY_KEY=/badger/key # path inside container for Badger key/LSM files
    ports:
      # Jaeger UI
      - "16686:16686"
      # OTLP gRPC receiver (for OpenTelemetry)
      - "4317:4317"
      # OTLP HTTP receiver
      - "4318:4318"
      # Jaeger Thrift receivers (legacy)
      - "14268:14268"
      - "14250:14250"
      # Zipkin receiver
      - "9411:9411"
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
  prometheus:
    # For metrics scraping and storage
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    # For metrics visualization and dashboards
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
    volumes:
      # Provisioning (auto-configure datasources & dashboards)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      # Persistent storage
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
      # Build argument for LOCAL DEVELOPMENT ONLY on macOS
      # Production uses Kubernetes/ECS/Cloud Run, not docker-compose
      args:
        RUN_AS_USER: root # Required for macOS Docker socket access
    command: >
      python -m src.api.app
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M
    env_file:
      - .env
    volumes:
      # Mount source code as read-only for live updates without rebuilding
      - ./src:/app/src:ro
      # Mount data directory for persistent storage
      - ./data:/app/data
      # Mount Docker socket for service discovery via Docker API
      # SECURITY NOTE: This gives container access to Docker daemon
      # - For DEV/TESTING only - acceptable risk in local development
      # - For PRODUCTION: Use Kubernetes, Consul, etcd, or other service mesh
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Override database host for Docker networking
      # RABBITMQ_HOST: local-rabbitmq
      POSTGRES_HOST: database
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    # AWS_S3_HOST: minio
    depends_on:
      database: # This service is the MOST important dependency
        condition: service_healthy
      redis:
        condition: service_healthy
      sentiment_model_1:
        condition: service_healthy
      regression_model_1:
        condition: service_healthy
    restart: unless-stopped

  # ===== Mock ML Backend Services =====
  sentiment_model_1:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m src.mock.app
      --model sentiment --port 8001 --latency 120
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount source code as read-only for live updates without rebuilding
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      # Use curl to check health endpoint if the Docker image has curl installed
      # test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      # Else:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 5

  regression_model_1:
