services:
  database:
    image: postgres:17.5-bookworm
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - api-gateway-db-volume:/var/lib/postgresql/data
      # Mount initialization script to create API database or other needed DBs
      # Please ensure the script has proper permissions (e.g., chmod +x)
      # Run for the 1st time ONLY: chmod +x docker/init_databases.sh
      # - type: bind
      #   source: ./docker/init_databases.sh
      #   target: /docker-entrypoint-initdb.d/init_databases.sh
      #   read_only: true
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-apigateway} -d ${POSTGRES_DB:-apigateway_db}
      interval: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:8.2.3-bookworm
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - type: bind
        source: ./docker/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # For Redis GUI management
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis
    # Connection URL:
    # redis://:<password>@<host>:<port>/<db_number>
    # e.g. redis://:redis@redis:6379/0
    # Note: Use `redis` instead of `localhost` when connecting from within another container

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m src.api.app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source code as read-only for live updates without rebuilding
      - ./src:/app/src:ro
      # Mount data directory for persistent storage
      - ./data:/app/data

    # environment:
    # Override database host for Docker networking
    # RABBITMQ_HOST: local-rabbitmq
    # POSTGRES_HOST: database
    # REDIS_HOST: redis
    # AWS_S3_HOST: minio
    depends_on:
      database: # This service is the MOST important dependency
        condition: service_healthy
      redis:
        condition: service_healthy
      sentiment_model_1:
        condition: service_healthy
      regression_model_1:
        condition: service_healthy
    restart: unless-stopped

  sentiment_model_1:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m src.mock.app
      --model sentiment --port 8001 --latency 500
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount source code as read-only for live updates without rebuilding
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      # Use curl to check health endpoint if the Docker image has curl installed
      # test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      # Else:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 5

  regression_model_1:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m src.mock.app
      --model regression --port 8002 --latency 88
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      # Mount source code as read-only for live updates without rebuilding
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      # Use curl to check health endpoint if the Docker image has curl installed
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 5

  classification_model_1:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m src.mock.app
      --model classification --port 8003 --latency 120
    ports:
      - "8003:8003"
    env_file:
      - .env
    volumes:
      # Mount source code as read-only for live updates without rebuilding
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      # Use curl to check health endpoint if the Docker image has curl installed
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 5

# Named volumes ONLY!
# Persist data outside the lifecycle of the container.
volumes:
  api-gateway-db-volume:
  redis-data:
  minio-data:
