apiVersion: 1

datasources:
  # ─────────────────────────────────────────────────────────
  # Jaeger (Traces)
  # ─────────────────────────────────────────────────────────
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      # Enable trace to logs correlation
      tracesToLogs:
        datasourceUid: 'loki'
        tags: ['trace_id']
