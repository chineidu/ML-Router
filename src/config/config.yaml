config:
  connection_config:
    timeout_seconds: 10
    connect_timeout_seconds: 5
    read_timeout_seconds: 3
    max_connections: 100
    max_keepalive_connections: 50

  registry_config:
    registry_file: "data/service_registry.json"
    load_registry_from_file: false
    health_check_interval: 20

  circuit_breaker_config:
    failure_threshold: 5
    recovery_timeout_seconds: 30

  bulkhead_config:
    queue_timeout_seconds: 2
    prediction_semaphore_config: # dict of model_type to max concurrent requests
      # Bulkhead pattern to limit concurrent requests to each model type
      classification: 20
      ner: 10
      regression: 25
      sentiment: 15

  load_balancer_config:
    strategy: weighted # Options: round_robin, weighted or least_connections

  api_config:
    title: TaskFlow API
    name: "${.title}"
    description: A Learning-Focused Task Queue System API
    version: v1.0.0
    status: healthy
    prefix: /api/v1
    auth_prefix: "${.prefix}/auth"
    middleware:
      cors:
        allow_origins:
          - "*"
        allow_credentials: true
        allow_methods:
          - "*"
        allow_headers:
          - "*"
    ratelimit:
      default_rate: 50
      burst_rate: 100000 # Update later (currently debugging)
      login_rate: 10

  database_config:
    pool_size: 30
    max_overflow: 10 # Allow N extra connections
    pool_timeout: 20 # Wait N seconds for connection
    pool_recycle: 1800 # Recycle connections after 30 minutes
    pool_pre_ping: true # Test connections before use
    echo: false
    expire_on_commit: false # False for async implementations
