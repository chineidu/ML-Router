config:
  connection_config:
    timeout_seconds: 10
    connect_timeout_seconds: 5
    read_timeout_seconds: 3
    max_connections: 100
    max_keepalive_connections: 20

  registry_config:
    registry_file: "data/service_registry.json"
    load_registry_from_file: false
    health_check_interval: 10

  circuit_breaker_config:
    failure_threshold: 5
    recovery_timeout_seconds: 30
    expected_exception_types:
      - ConnectionError
      - TimeoutError
  load_balancer_config:
    strategy: weighted

  api_config:
    title: TaskFlow API
    name: "${.title}"
    description: A Learning-Focused Task Queue System API
    version: v1.0.0
    status: healthy
    prefix: /api/v1
    auth_prefix: "${.prefix}/auth"
    middleware:
      cors:
        allow_origins:
          - "*"
        allow_credentials: true
        allow_methods:
          - "*"
        allow_headers:
          - "*"
    ratelimit:
      default_rate: 50
      burst_rate: 100
      login_rate: 10
